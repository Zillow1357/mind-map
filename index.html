<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心智圖工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6;--dot:#cdd6e0;--surface:#ffffff;--text:#1d2733;--muted:#66758a;
  --bar:#ffffffee;--line:#d5dce5;--root:#1f3a5f;--roottext:#ffffff;--accent:#2f6fed;
  --c0:#2f6fed;--c1:#13a08a;--c2:#e08a1e;--c3:#c8407a;--c4:#7a56d6;--c5:#4a9a2c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e;--dot:#26303c;--surface:#1c2430;--text:#e6ecf3;--muted:#8d9db1;
  --bar:#1a222cee;--line:#2e3a48;--root:#8fb4f5;--roottext:#10213a;--accent:#6b9bff;
  --c0:#6b9bff;--c1:#3cc7ae;--c2:#f0a94a;--c3:#ee7aa8;--c4:#a58bf0;--c5:#7fc95f;}}
:root[data-theme="dark"]{
  --bg:#12171e;--dot:#26303c;--surface:#1c2430;--text:#e6ecf3;--muted:#8d9db1;
  --bar:#1a222cee;--line:#2e3a48;--root:#8fb4f5;--roottext:#10213a;--accent:#6b9bff;
  --c0:#6b9bff;--c1:#3cc7ae;--c2:#f0a94a;--c3:#ee7aa8;--c4:#a58bf0;--c5:#7fc95f;}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;touch-action:none;cursor:grab}
#stage.pan{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.node rect{fill:var(--surface);stroke-width:2;transition:stroke-width .12s}
.node text{fill:var(--text);font-size:15px;pointer-events:none}
.node.root rect{stroke:none}
.node.root text{fill:var(--roottext);font-size:18px;font-weight:700}
.halo{pointer-events:none}
dialog input:not([type=file]){width:100%;box-sizing:border-box;margin:4px 0;font:inherit;padding:9px 10px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;-webkit-user-select:text;user-select:text}
#bigimg{max-width:100%;max-height:68vh;display:block;margin:auto;border-radius:8px}
.add{cursor:pointer}.add circle{fill:var(--accent)}.add text{fill:#fff;font-size:18px;font-weight:700;text-anchor:middle;pointer-events:none}
.sw,.sw:hover{width:22px;height:22px;padding:0;margin:auto 2px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
#cpick{width:30px;height:30px;padding:0;margin:auto 2px;border:none;background:none;cursor:pointer}
.node{cursor:pointer}
.tog circle{fill:var(--surface);stroke-width:2}
.tog text{fill:var(--muted);font-size:12px;font-weight:700;text-anchor:middle}
.tog{cursor:pointer}
#bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px);padding:6px;border-radius:12px;background:var(--bar);border:1px solid var(--line);backdrop-filter:blur(8px);z-index:5}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--bg);border-color:var(--line)}
button:focus-visible,#ed:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#fff}
button.primary:hover{background:var(--accent);filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default}
.sep{width:1px;background:var(--line);margin:4px 2px}
#ed{position:fixed;display:none;z-index:8;font:inherit;text-align:center;color:var(--text);background:transparent;border:0;border-radius:0;padding:0;margin:0;box-sizing:border-box;caret-color:var(--accent);-webkit-user-select:text;user-select:text}
#ed:focus-visible{outline:none}
.tg{padding:6px 9px;font-size:13px}.tg.on{background:var(--accent);color:#fff}
#hint{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:8px 12px;z-index:4;max-width:calc(100% - 24px)}
#hint kbd{font:inherit;font-weight:700;color:var(--text)}
@media (max-width:640px){#hint{display:none}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);padding:18px;width:min(520px,calc(100% - 32px));font:inherit}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 6px;font-size:17px}
dialog p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.6}
textarea{width:100%;height:220px;box-sizing:border-box;resize:vertical;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><svg id="svg" role="application" aria-label="心智圖畫布"><defs id="imgdefs"></defs><g id="vp"></g></svg></div>
<div id="bar">
  <button id="bChild" class="primary" title="新增子節點（Tab）">＋子節點</button>
  <button id="bSib" title="新增同層節點（Enter）">＋同層</button>
  <button id="bEdit" title="編輯文字（F2 或雙擊）">編輯</button>
  <button id="bDel" title="刪除節點（Delete）">刪除</button>
  <button id="bImg" title="上傳圖片並連到選取的節點">圖片</button>
  <button id="bVid" title="加入影片連結縮圖並連到選取的節點">影片</button>
  <span class="sep"></span>
  <button id="bArr" title="自動整理版面">整理</button>
  <span class="sep"></span>
  <button class="tg on" data-t="fill" title="修改節點內部顏色">填滿</button><button class="tg" data-t="tc" title="修改文字顏色">文字</button><button class="tg" data-t="bd" title="修改邊框與連線顏色">邊框</button>
  <button class="sw" data-c="var(--c0)" style="background:var(--c0)" aria-label="顏色 1"></button><button class="sw" data-c="var(--c1)" style="background:var(--c1)" aria-label="顏色 2"></button><button class="sw" data-c="var(--c2)" style="background:var(--c2)" aria-label="顏色 3"></button><button class="sw" data-c="var(--c3)" style="background:var(--c3)" aria-label="顏色 4"></button><button class="sw" data-c="var(--c4)" style="background:var(--c4)" aria-label="顏色 5"></button><button class="sw" data-c="var(--c5)" style="background:var(--c5)" aria-label="顏色 6"></button><input type="color" id="cpick" value="#2f6fed" aria-label="自訂顏色" title="自訂顏色"><button id="bClr" title="還原目前項目的預設色">還原</button>
  <span class="sep"></span>
  <button id="bUndo" title="復原（Ctrl+Z）">復原</button>
  <button id="bFit" title="置中並縮放至適當大小">置中</button>
  <button id="bZin" aria-label="放大">＋</button>
  <button id="bZout" aria-label="縮小">－</button>
  <span class="sep"></span>
  <button id="bIO">匯出／匯入</button>
  <button id="bTheme" aria-label="切換深淺色">◐</button>
</div>
<div id="hint">
  <kbd>Tab</kbd> 新增子節點　<kbd>Enter</kbd> 新增同層　<kbd>F2</kbd>／雙擊 編輯<br>
  <kbd>Delete</kbd> 刪除　<kbd>方向鍵</kbd> 移動選取　<kbd>空白鍵</kbd> 收合／展開<br>
  選取節點後點兩側的 <kbd>＋</kbd> 新增子節點<br>拖曳節點自由移動；拖到另一節點上放開即連結<br>單擊選取（再單擊仍維持選取，第三下取消）、雙擊編輯文字、點空白處取消<br>圖片／影片節點：雙擊可放大圖片或開啟影片連結<br>拖曳空白處平移，滾輪縮放
</div>
<input id="ed" aria-label="節點文字" maxlength="80">
<input type="file" id="fimg" accept="image/*" hidden>
<dialog id="vdlg"><h2 id="vt">加入影片連結</h2><p>貼上影片網址。YouTube 會自動顯示縮圖，其他網站顯示通用影片卡片。</p><input id="vurl" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="影片網址"><input id="vtitle" placeholder="標題（選填）" maxlength="40" aria-label="標題"><div class="row"><button id="vok" class="primary">確定</button><button id="vcancel">取消</button></div></dialog>
<dialog id="idlg"><img id="bigimg" alt=""><div class="row"><button id="iclose">關閉</button></div></dialog>
<div id="toast"></div>

<dialog id="dlg">
  <h2>匯出／匯入</h2>
  <p>下方是目前心智圖的 JSON。複製後可自行保存；貼上其他內容再按「匯入」即可載入。</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row">
    <button id="dCopy">複製</button>
    <button id="dImp" class="primary">匯入</button>
    <button id="dClose">關閉</button>
  </div>
</dialog>

<script>
(function(){
var KEY="mindmap-v2", OLD="mindmap-v1";
var H=38, RH=46, GAP=14, HGAP=60, PAD=18;
var PAL=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
var uid=1, root, selId, view={x:0,y:0,k:1}, undoStack=[], editing=null, dropId=null, list=[], needArr=false;
var drag=null, pts={}, pinch=null, cpSnap=false, lastTap={}, desTimer=null, selClicks=0;
function $(id){return document.getElementById(id);}
var svg=$("svg"), vp=$("vp"), stage=$("stage"), ed=$("ed"), toastEl=$("toast");
var cv=document.createElement("canvas").getContext("2d");

function mk(text,x,y){return {id:"n"+(uid++),text:text,children:[],collapsed:false,x:x||0,y:y||0};}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function toast(t){toastEl.textContent=t;toastEl.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.classList.remove("on");},1800);}
function sample(){
  var r=mk("我的心智圖"), a=mk("想法",1), b=mk("任務",1), c=mk("資源",-1), d=mk("下一步",-1);
  a.children=[mk("主題發想"),mk("關鍵問題")]; b.children=[mk("本週待辦"),mk("長期目標")];
  c.children=[mk("參考文章"),mk("工具清單")];
  r.children=[a,b,c,d]; root=r; arrange(true); return r;
}

/* ---------- 資料 ---------- */
function find(n,id,parent){
  if(n.id===id) return {node:n,parent:parent||null};
  for(var i=0;i<n.children.length;i++){var r=find(n.children[i],id,n); if(r) return r;}
  return null;
}
function collect(n,s){s[n.id]=1;n.children.forEach(function(c){collect(c,s);});return s;}
function shift(n,dx,dy){n.children.forEach(function(c){c.x+=dx;c.y+=dy;shift(c,dx,dy);});}
function put(n,x,y){var dx=x-n.x,dy=y-n.y;n.x=x;n.y=y;shift(n,dx,dy);}
function save(){try{localStorage.setItem(KEY,JSON.stringify({root:root,uid:uid,sel:selId}));}catch(e){toast("瀏覽器儲存空間不足，請用「匯出」備份");}}
function snapshot(){undoStack.push(JSON.stringify(root));if(undoStack.length>60)undoStack.shift();}
function fixUid(n){var m=parseInt(String(n.id).slice(1),10)||0;if(m>=uid)uid=m+1;n.children.forEach(fixUid);}
var target="fill";
function norm(n){if(n.color){n.fill=n.fill||n.color;n.bd=n.bd||n.color;delete n.color;}n.children.forEach(norm);}
function okColor(c){return typeof c==="string"&&(/^#[0-9a-f]{6}$/i.test(c)||/^var\(--c[0-5]\)$/.test(c));}
function rebuild(o,legacy){
  if(!o||typeof o.text!=="string") throw new Error("格式錯誤");
  var n=mk(o.text.slice(0,80)); n.collapsed=!!o.collapsed;
  var m=o.media, mw=m&&+m.w, mh=m&&+m.h;
  if(!legacy&&m&&mw>0&&mh>0&&mw<=400&&mh<=400){
    if(m.type==="image"&&/^data:image\//.test(m.src)) n.media={type:"image",src:m.src,w:mw,h:mh};
    else if(m.type==="video"&&/^https?:\/\//.test(m.url)) n.media={type:"video",url:m.url,thumb:/^https:\/\/img\.youtube\.com\//.test(m.thumb||"")?m.thumb:"",host:String(m.host||"").slice(0,60),w:mw,h:mh};
  }
  if(!legacy){["fill","bd","tc"].forEach(function(k){if(okColor(o[k])) n[k]=o[k];}); if(okColor(o.color)){n.fill=n.fill||o.color;n.bd=n.bd||o.color;}}
  if(!legacy&&typeof o.x==="number"&&typeof o.y==="number"){n.x=o.x;n.y=o.y;} else needArr=true;
  n.children=(Array.isArray(o.children)?o.children:[]).map(function(c){return rebuild(c,legacy);});
  return n;
}
function clean(n){
  var o={text:n.text,collapsed:!!n.collapsed,x:Math.round(n.x),y:Math.round(n.y),children:n.children.map(clean)};
  ["fill","bd","tc"].forEach(function(k){if(n[k]) o[k]=n[k];}); if(n.media) o.media=n.media; return o;
}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.root&&Array.isArray(s.root.children)){root=s.root;uid=s.uid||1;selId=s.sel;fixUid(root);norm(root);return;}}catch(e){}
  try{var o=JSON.parse(localStorage.getItem(OLD));
    if(o&&o.root){needArr=false;root=rebuild(o.root,true);arrange(true);selId=root.id;return;}}catch(e){}
  sample(); selId=root.id;
}
function commit(){render();save();}

/* ---------- 版面 ---------- */
function measure(n,isRoot){
  cv.font=(isRoot?"700 18px ":"15px ")+'"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  return Math.max(isRoot?96:64,Math.ceil(cv.measureText(n.text).width)+PAD*2);
}
function visList(){
  list=[];
  (function w(n,d,pc,i){
    n.w=n.media?n.media.w:measure(n,d===0); n.h=n.media?n.media.h:(d===0?RH:H); n._d=d;
    n._c=n.bd||(d===0?"var(--root)":d===1?PAL[i%6]:pc);
    list.push(n);
    if(!n.collapsed) n.children.forEach(function(c,j){w(c,d+1,n._c,j);});
  })(root,0,"",0);
  return list;
}
function sh(n){
  n.w=n.media?n.media.w:measure(n,n===root); n.h=n.media?n.media.h:(n===root?RH:H);
  var v=n.collapsed?[]:n.children,t=0;
  v.forEach(function(c,i){sh(c);t+=c.sh+(i?GAP:0);});
  n.ctot=t; n.sh=Math.max(n.h,t);
}
function place(n,dir,edge,top){
  var ox=n.x,oy=n.y; n.x=edge+dir*(HGAP+n.w/2);
  var v=n.collapsed?[]:n.children;
  if(!v.length) n.y=top+n.sh/2;
  else{
    var cy=top+(n.sh-n.ctot)/2;
    v.forEach(function(c){place(c,dir,n.x+dir*n.w/2,cy);cy+=c.sh+GAP;});
    n.y=(v[0].y+v[v.length-1].y)/2;
  }
  if(n.collapsed) shift(n,n.x-ox,n.y-oy);
}
function arrange(noSnap){
  if(!noSnap) snapshot();
  sh(root); if(root.collapsed) return;
  var R=[],L=[];
  root.children.forEach(function(c){(c.x>=root.x?R:L).push(c);});
  [[R,1],[L,-1]].forEach(function(g){
    var tot=0; g[0].forEach(function(c,i){tot+=c.sh+(i?GAP:0);});
    var cy=root.y-tot/2;
    g[0].forEach(function(c){place(c,g[1],root.x+g[1]*root.w/2,cy);cy+=c.sh+GAP;});
  });
}
function nudge(n){
  var sub=collect(n,{});
  for(var i=0;i<80;i++){
    var hit=list.some(function(o){return !sub[o.id]&&Math.abs(o.x-n.x)<(o.w+n.w)/2+10&&Math.abs(o.y-n.y)<(o.h+n.h)/2+8;});
    if(!hit) break; put(n,n.x,n.y+H+8);
  }
}
function nodeAt(x,y,ex){
  for(var i=list.length-1;i>=0;i--){var n=list[i];
    if(!(ex&&ex[n.id])&&Math.abs(x-n.x)<=n.w/2&&Math.abs(y-n.y)<=n.h/2) return n;}
  return null;
}
function toWorld(cx,cy){var r=stage.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}

/* ---------- 繪製 ---------- */
function ink(col){
  if(col.charAt(0)==="#"){
    var r=parseInt(col.substr(1,2),16),g=parseInt(col.substr(3,2),16),b=parseInt(col.substr(5,2),16);
    return (0.299*r+0.587*g+0.114*b)>160?"#1d2733":"#ffffff";
  }
  return "var(--roottext)";
}
function tcol(n){var f=n.fill||(n._d===0?"var(--root)":null);return n.tc||(f?ink(f):"var(--text)");}
function render(){
  visList();
  syncImgs();
  var links="",nodes="",tog="",plus="",sn=null;
  list.forEach(function(n){
    if(!n.collapsed) n.children.forEach(function(c){
      var rt=c.x>=n.x, x1=n.x+(rt?1:-1)*n.w/2, x2=c.x+(rt?-1:1)*c.w/2, mx=(x1+x2)/2;
      links+='<path d="M'+x1+' '+n.y+'C'+mx+' '+n.y+' '+mx+' '+c.y+' '+x2+' '+c.y+'" fill="none" stroke="'+c._c+'" stroke-width="'+(n._d===0?3:2)+'" stroke-linecap="round" opacity=".8"/>';
    });
    var isRoot=n._d===0, fill=n.fill||(isRoot?"var(--root)":null), x=n.x-n.w/2, y=n.y-n.h/2, sel=n.id===selId, drop=n.id===dropId;
    if(sel) sn=n;
    nodes+=n.media?mediaNode(n,sel,drop):'<g class="node'+(isRoot?" root":"")+'" data-id="'+n.id+'"><rect x="'+x+'" y="'+y+'" width="'+n.w+'" height="'+n.h+'" rx="'+(n.h/2)+'" style="stroke:'+(isRoot&&!n.bd?"none":n._c)+';fill:'+(fill||"var(--surface)")+'"/>'+
      ((sel||drop)?'<rect class="halo" x="'+(x-5)+'" y="'+(y-5)+'" width="'+(n.w+10)+'" height="'+(n.h+10)+'" rx="'+(n.h/2+5)+'" style="fill:none;stroke:var(--accent);stroke-width:'+(drop?3:2)+(drop?";stroke-dasharray:6 4":"")+'"/>':"")+
      '<text x="'+n.x+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="central" style="fill:'+tcol(n)+'">'+(editing===n.id?"":esc(n.text))+'</text></g>';
    if(n.children.length){
      var ty=n.y+n.h/2+11;
      tog+='<g class="tog" data-tog="'+n.id+'"><circle cx="'+n.x+'" cy="'+ty+'" r="8" style="stroke:'+n._c+'"/><text x="'+n.x+'" y="'+ty+'" dominant-baseline="central">'+(n.collapsed?n.children.length:"−")+'</text></g>';
    }
  });
  if(sn&&!editing&&!(drag&&drag.moved)) [-1,1].forEach(function(d){
    var px=sn.x+d*(sn.w/2+22);
    plus+='<g class="add" data-add="'+d+'"><circle cx="'+px+'" cy="'+sn.y+'" r="12"/><text x="'+px+'" y="'+sn.y+'" dominant-baseline="central">+</text></g>';
  });
  vp.innerHTML=links+nodes+tog+plus;
  applyView();
  $("bUndo").disabled=!undoStack.length;
  var none=!selId||!find(root,selId);
  $("bChild").disabled=$("bEdit").disabled=none;
  $("bDel").disabled=$("bSib").disabled=none||selId===root.id;
}
function applyView(){vp.setAttribute("transform","translate("+view.x+","+view.y+") scale("+view.k+")");}
function fit(){
  visList(); var a=1e9,b=-1e9,c=1e9,d=-1e9;
  list.forEach(function(n){a=Math.min(a,n.x-n.w/2);b=Math.max(b,n.x+n.w/2);c=Math.min(c,n.y-n.h/2);d=Math.max(d,n.y+n.h/2);});
  var W=stage.clientWidth,Hh=stage.clientHeight;
  var k=Math.min(1.2,Math.max(.25,Math.min((W-120)/(b-a),(Hh-200)/(d-c))));
  view.k=k; view.x=W/2-(a+b)/2*k; view.y=Hh/2-(c+d)/2*k+30; applyView();
}
function zoomAt(f,cx,cy){
  var k=Math.min(2.5,Math.max(.25,view.k*f)); f=k/view.k;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.k=k; applyView();
}

/* ---------- 編輯與操作 ---------- */
function select(id){selId=id;render();save();}
var editOrig="";
function posEd(){
  var r=find(root,editing); if(!r) return;
  var g=vp.querySelector('[data-id="'+editing+'"] rect'); if(!g) return;
  var b=g.getBoundingClientRect(), n=r.node, isRoot=n._d===0;
  ed.style.left=b.left+"px"; ed.style.top=b.top+"px"; ed.style.width=b.width+"px"; ed.style.height=b.height+"px";
  ed.style.fontSize=(isRoot?18:15)*view.k+"px"; ed.style.fontWeight=isRoot?"700":"400"; ed.style.color=tcol(n);
}
function startEdit(id){
  var r=find(root,id); if(!r) return;
  if(editing) endEdit(true);
  if(r.node.media){selId=id; if(r.node.media.type==="video") openVideoDlg(id); else toast("圖片節點沒有文字可以編輯"); render(); return;}
  selId=id; editing=id; editOrig=r.node.text; render();
  ed.style.display="block"; ed.value=r.node.text; posEd(); ed.focus();
  if(r.node.text==="新節點") ed.select(); else ed.setSelectionRange(ed.value.length,ed.value.length);
}
function endEdit(ok){
  if(!editing) return; var id=editing; editing=null; ed.style.display="none";
  var v=ed.value.trim(), r=find(root,id);
  if(r){r.node.text=editOrig; if(ok&&v&&v!==editOrig){snapshot();r.node.text=v;}}
  commit();
}
ed.addEventListener("input",function(){
  var r=find(root,editing); if(!r) return;
  r.node.text=ed.value; render(); posEd();
});
ed.addEventListener("keydown",function(e){
  e.stopPropagation();
  if(e.key==="Enter"&&!e.isComposing){e.preventDefault();endEdit(true);}
  else if(e.key==="Escape"){endEdit(false);}
  else if(e.key==="Tab"&&!e.isComposing){e.preventDefault();endEdit(true);addChild();}
});
ed.addEventListener("blur",function(){endEdit(true);});

function addAt(dir,c0){
  var r=find(root,selId); if(!r) return; var n=r.node; snapshot(); visList();
  var c=c0||mk("新節點"); if(!c0){c.w=measure(c,false); c.h=H;}
  var sib=n.children.filter(function(k){return (k.x>=n.x)===(dir>0);}), y=n.y;
  if(sib.length) y=Math.max.apply(null,sib.map(function(k){return k.y;}))+H+GAP;
  c.x=n.x+dir*(n.w/2+HGAP+c.w/2); c.y=y;
  n.children.push(c); n.collapsed=false; visList(); nudge(c);
  selId=c.id; commit(); if(!c0) startEdit(c.id);
}
function addChild(){
  var r=find(root,selId); if(!r) return;
  addAt(r.parent&&r.node.x<r.parent.x?-1:1);
}
function addSibling(){
  var r=find(root,selId); if(!r||!r.parent) return; snapshot(); visList();
  var n=r.node, c=mk("新節點"); c.w=measure(c,false); c.h=H; c.x=n.x; c.y=n.y+n.h+GAP;
  r.parent.children.splice(r.parent.children.indexOf(n)+1,0,c); visList(); nudge(c);
  selId=c.id; commit(); startEdit(c.id);
}
function del(){
  var r=find(root,selId); if(!r||!r.parent) return; snapshot();
  var i=r.parent.children.indexOf(r.node); r.parent.children.splice(i,1);
  selId=(r.parent.children[i]||r.parent.children[i-1]||r.parent).id; commit();
}
function toggle(id){
  var r=find(root,id); if(!r||!r.node.children.length) return; snapshot();
  r.node.collapsed=!r.node.collapsed; commit();
}
function undo(){
  if(!undoStack.length) return; root=JSON.parse(undoStack.pop());
  if(selId&&!find(root,selId)) selId=null; commit(); toast("已復原");
}
function setColor(c,noSnap){
  var r=find(root,selId); if(!r) return; if(!noSnap) snapshot();
  if(c) r.node[target]=c; else delete r.node[target]; commit();
}
function reparent(id,tid){
  var r=find(root,id), t=find(root,tid); if(!r||!r.parent||!t) return;
  var n=r.node, tn=t.node;
  r.parent.children.splice(r.parent.children.indexOf(n),1);
  tn.children.push(n); tn.collapsed=false; visList();
  var dir=n.x>=tn.x?1:-1, y=tn.y;
  var s=tn.children.filter(function(k){return k!==n&&(k.x>=tn.x)===(dir>0);});
  if(s.length) y=Math.max.apply(null,s.map(function(k){return k.y;}))+H+GAP;
  put(n,tn.x+dir*(tn.w/2+HGAP+n.w/2),y); visList(); nudge(n);
  selId=n.id; toast("已連結到「"+tn.text+"」");
}
function nav(dir){
  var r=find(root,selId); if(!r) return; var n=r.node, p=r.parent, t=null;
  function kid(d){return (n.collapsed?[]:n.children).filter(function(c){return (c.x>=n.x)===(d>0);})[0];}
  if(dir==="Left") t=(p&&n.x>=p.x)?p:kid(-1);
  else if(dir==="Right") t=(p&&n.x<p.x)?p:kid(1);
  else if(p){
    var s=p.children.filter(function(c){return (c.x>=p.x)===(n.x>=p.x);}).sort(function(a,b){return a.y-b.y;});
    t=s[s.indexOf(n)+(dir==="Up"?-1:1)];
  }
  if(t) select(t.id);
}

/* ---------- 指標操作 ---------- */
stage.addEventListener("pointerdown",function(e){
  if(editing) endEdit(true);
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pts);
  if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null;return;}
  var t=e.target.closest("[data-tog]"); if(t){toggle(t.getAttribute("data-tog"));return;}
  var ad=e.target.closest("[data-add]"); if(ad){addAt(+ad.getAttribute("data-add"));return;}
  stage.setPointerCapture(e.pointerId); if(desTimer){clearTimeout(desTimer);desTimer=null;}
  var nd=e.target.closest("[data-id]");
  if(nd){
    var id=nd.getAttribute("data-id"), was=selId===id; if(!was){selId=id;selClicks=0;render();save();}
    drag={m:"node",id:id,was:was,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false}; return;
  }
  drag={m:"pan",moved:false,x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; stage.classList.add("pan");
});
stage.addEventListener("pointermove",function(e){
  if(!pts[e.pointerId]) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(pts);
  if(pinch&&ids.length===2){
    var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); pinch.d=d; return;
  }
  if(!drag) return;
  if(drag.m==="pan"){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>4) drag.moved=true; view.x=drag.vx+e.clientX-drag.x;view.y=drag.vy+e.clientY-drag.y;applyView();return;}
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5) return; drag.moved=true; snapshot();}
  var r=find(root,drag.id); if(!r) return;
  var dx=(e.clientX-drag.lx)/view.k, dy=(e.clientY-drag.ly)/view.k; drag.lx=e.clientX; drag.ly=e.clientY;
  r.node.x+=dx; r.node.y+=dy; shift(r.node,dx,dy);
  var w=toWorld(e.clientX,e.clientY), o=nodeAt(w.x,w.y,collect(r.node,{}));
  dropId=o?o.id:null; render();
});
function up(e){
  delete pts[e.pointerId]; if(Object.keys(pts).length<2) pinch=null;
  if(drag&&drag.m==="node"&&drag.moved){if(dropId) reparent(drag.id,dropId); dropId=null; commit();}
  else if(drag&&e.type==="pointerup"&&drag.m==="node"){
    var now=Date.now();
    if(lastTap.id===drag.id&&now-lastTap.t<350){lastTap={};selClicks=0;activate(drag.id);}
    else{lastTap={id:drag.id,t:now}; if(drag.was){selClicks++; if(selClicks>=2){selClicks=0;selId=null;commit();}}}
  }
  else if(drag&&e.type==="pointerup"&&drag.m==="pan"&&!drag.moved){selId=null;commit();}
  drag=null; stage.classList.remove("pan");
}
stage.addEventListener("pointerup",up); stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY);},{passive:false});

document.addEventListener("keydown",function(e){
  if(editing||document.querySelector("dialog[open]")||e.target.id==="cpick") return;
  var k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==="z"){e.preventDefault();undo();}
  else if(k==="Tab"){e.preventDefault();addChild();}
  else if(k==="Enter"){e.preventDefault();addSibling();}
  else if(k==="F2"){e.preventDefault();startEdit(selId);}
  else if(k==="Delete"||k==="Backspace"){e.preventDefault();del();}
  else if(k===" "){e.preventDefault();toggle(selId);}
  else if(k.indexOf("Arrow")===0){e.preventDefault();nav(k.slice(5));}
});
window.addEventListener("resize",function(){if(editing) endEdit(true);});

$("bChild").onclick=addChild; $("bSib").onclick=addSibling;
$("bEdit").onclick=function(){startEdit(selId);}; $("bDel").onclick=del;
$("bUndo").onclick=undo; $("bFit").onclick=fit;
$("bArr").onclick=function(){arrange();commit();fit();toast("已自動整理");};
$("bZin").onclick=function(){zoomAt(1.2,stage.clientWidth/2,stage.clientHeight/2);};
$("bZout").onclick=function(){zoomAt(1/1.2,stage.clientWidth/2,stage.clientHeight/2);};
$("bTheme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");
};
Array.prototype.forEach.call(document.querySelectorAll(".sw"),function(b){b.onclick=function(){setColor(b.getAttribute("data-c"));};});
$("bClr").onclick=function(){setColor(null);};
Array.prototype.forEach.call(document.querySelectorAll(".tg"),function(b){b.onclick=function(){target=b.getAttribute("data-t");Array.prototype.forEach.call(document.querySelectorAll(".tg"),function(x){x.classList.toggle("on",x===b);});};});
$("cpick").addEventListener("input",function(){setColor(this.value,cpSnap);if(!cpSnap){cpSnap=true;}});
$("cpick").addEventListener("pointerdown",function(){snapshot();});
$("cpick").addEventListener("change",function(){cpSnap=false;});

/* ---------- 圖片與影片 ---------- */
var NS="http://www.w3.org/2000/svg", inDefs={}, vEditId=null;
function syncImgs(){
  var defs=$("imgdefs");
  list.forEach(function(n){
    var m=n.media; if(!m) return;
    var u=m.type==="image"?m.src:m.thumb; if(!u||inDefs[n.id]===u) return;
    var old=$("im_"+n.id); if(old) old.remove();
    var im=document.createElementNS(NS,"image");
    im.id="im_"+n.id; im.setAttribute("width",m.w); im.setAttribute("height",m.h);
    im.setAttribute("preserveAspectRatio","xMidYMid slice"); im.setAttribute("href",u);
    defs.appendChild(im); inDefs[n.id]=u;
  });
}
function mediaNode(n,sel,drop){
  var m=n.media,x=n.x-n.w/2,y=n.y-n.h/2,id=n.id,u=m.type==="image"?m.src:m.thumb;
  var g='x="'+x+'" y="'+y+'" width="'+n.w+'" height="'+n.h+'" rx="10"';
  var s='<g class="node media" data-id="'+id+'"><defs><clipPath id="cp'+id+'"><rect '+g+'/></clipPath></defs><rect '+g+' style="fill:var(--surface);stroke:none"/>';
  if(m.type==="video") s+='<text x="'+n.x+'" y="'+(n.y+36)+'" text-anchor="middle" style="fill:var(--muted);font-size:12px">'+esc(m.host)+'</text>';
  if(u) s+='<use href="#im_'+id+'" x="'+x+'" y="'+y+'" clip-path="url(#cp'+id+')"/>';
  if(m.type==="video"){
    s+='<circle cx="'+n.x+'" cy="'+n.y+'" r="20" style="fill:#000;opacity:.55"/><polygon points="'+(n.x-6)+','+(n.y-10)+' '+(n.x-6)+','+(n.y+10)+' '+(n.x+10)+','+n.y+'" style="fill:#fff"/>';
    if(n.text){var t=n.text.length>13?n.text.slice(0,12)+"…":n.text;
      s+='<g clip-path="url(#cp'+id+')"><rect x="'+x+'" y="'+(y+n.h-26)+'" width="'+n.w+'" height="26" style="fill:#000;opacity:.6"/><text x="'+n.x+'" y="'+(y+n.h-13)+'" text-anchor="middle" dominant-baseline="central" style="fill:#fff;font-size:12px">'+esc(t)+'</text></g>';}
  }
  s+='<rect '+g+' style="fill:none;stroke:'+n._c+';stroke-width:2.5"/>';
  if(sel||drop) s+='<rect class="halo" x="'+(x-5)+'" y="'+(y-5)+'" width="'+(n.w+10)+'" height="'+(n.h+10)+'" rx="15" style="fill:none;stroke:var(--accent);stroke-width:'+(drop?3:2)+(drop?";stroke-dasharray:6 4":"")+'"/>';
  return s+'</g>';
}
function addMedia(media,text){
  if(!find(root,selId)) selId=root.id;
  var r=find(root,selId), dir=r.parent&&r.node.x<r.parent.x?-1:1;
  var c=mk(text||""); c.media=media; c.w=media.w; c.h=media.h;
  addAt(dir,c); toast("已加入並連到「"+(r.node.media?"媒體":r.node.text)+"」");
}
function loadImage(file){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      if(!im.width||!im.height){toast("無法讀取這張圖片");return;}
      var k=Math.min(1,640/Math.max(im.width,im.height)), cw=Math.max(1,Math.round(im.width*k)), ch=Math.max(1,Math.round(im.height*k));
      var c=document.createElement("canvas"); c.width=cw; c.height=ch; var g=c.getContext("2d");
      var jpeg=file.type==="image/jpeg"; if(jpeg){g.fillStyle="#fff";g.fillRect(0,0,cw,ch);}
      g.drawImage(im,0,0,cw,ch);
      var src=c.toDataURL(jpeg?"image/jpeg":"image/webp",0.85), s=Math.min(180/cw,150/ch);
      addMedia({type:"image",src:src,w:Math.max(24,Math.round(cw*s)),h:Math.max(24,Math.round(ch*s))});
    };
    im.onerror=function(){toast("無法讀取這張圖片");};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function ytThumb(u){
  var m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m?"https://img.youtube.com/vi/"+m[1]+"/hqdefault.jpg":"";
}
function openUrl(u){
  var w=null; try{w=window.open(u,"_blank");}catch(e){}
  if(w){try{w.opener=null;}catch(e){}}
  else{try{navigator.clipboard.writeText(u);}catch(e){} toast("無法直接開啟，連結已複製");}
}
function activate(id){
  var r=find(root,id); if(!r) return; var m=r.node.media;
  if(!m){startEdit(id);return;}
  if(m.type==="image"){$("bigimg").src=m.src;$("idlg").showModal();} else openUrl(m.url);
}
function openVideoDlg(id){
  vEditId=id; var r=id&&find(root,id), n=r&&r.node;
  $("vt").textContent=n?"編輯影片連結":"加入影片連結";
  $("vurl").value=n?n.media.url:""; $("vtitle").value=n?n.text:"";
  $("vdlg").showModal(); $("vurl").focus();
}
$("bImg").onclick=function(){$("fimg").click();};
$("fimg").onchange=function(){var f=this.files&&this.files[0]; this.value=""; if(f) loadImage(f);};
$("bVid").onclick=function(){openVideoDlg(null);};
$("vcancel").onclick=function(){$("vdlg").close();};
$("iclose").onclick=function(){$("idlg").close();};
$("vok").onclick=function(){
  var u=$("vurl").value.trim(), h;
  try{var o=new URL(u); if(!/^https?:$/.test(o.protocol)) throw 0; h=o.hostname.replace(/^www\./,"");}
  catch(e){toast("請輸入有效的網址（http 或 https）");return;}
  var t=$("vtitle").value.trim().slice(0,40); $("vdlg").close();
  if(vEditId){var r=find(root,vEditId); if(r){snapshot(); r.node.text=t; r.node.media.url=u; r.node.media.thumb=ytThumb(u); r.node.media.host=h; commit();}}
  else addMedia({type:"video",url:u,thumb:ytThumb(u),host:h,w:176,h:99},t);
};

/* ---------- 匯出／匯入 ---------- */
var dlg=$("dlg"), ta=$("ta");
$("bIO").onclick=function(){ta.value=JSON.stringify(clean(root),null,2);dlg.showModal();};
$("dClose").onclick=function(){dlg.close();};
$("dCopy").onclick=function(){
  ta.select();
  try{navigator.clipboard.writeText(ta.value).then(function(){toast("已複製");},function(){document.execCommand("copy");toast("已複製");});}
  catch(e){try{document.execCommand("copy");toast("已複製");}catch(_){toast("請手動複製");}}
};
$("dImp").onclick=function(){
  try{
    needArr=false; var n=rebuild(JSON.parse(ta.value)); snapshot(); root=n; selId=root.id;
    if(needArr) arrange(true); dlg.close(); commit(); fit(); toast("已匯入");
  }catch(e){toast("無法匯入：JSON 格式不正確");}
};

/* ---------- 啟動 ---------- */
load(); if(selId&&!find(root,selId)) selId=null;
render(); fit();
})();
</script>
